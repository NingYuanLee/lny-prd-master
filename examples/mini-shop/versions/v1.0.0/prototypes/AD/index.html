<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Mini Shop AD 汇总</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/mui-kit.css">
  <link rel="stylesheet" href="assets/proto-shell.css">
</head>
<body>
  <div id="proto-root"></div>
  <script>
    window.PROTO_SHELL = {
      terminal: "AD",
      mode: "desktop",
      title: "管理后台原型",
      pages: [
        {
          id: "PAGE-AD-001",
          name: "商品列表",
          module: "商品",
          file: "PAGE-AD-001.html",
          tabBarExempt: true,
          comps: [],
          spec: {
            layout: "D1-1：搜索栏（名称/库存状态/上架日期）+ 页内签 + 新增 + 表格操作列 + 三类弹窗 + 分页。",
            comps: "无",
            apis: "API-AD-001 列表；API-AD-002 详情；API-AD-003 快捷保存\n进页、查询、翻页、页内签、打开弹窗。",
            features: "FEATURE-001 · 后台核对\nFEATURE-002 · 弹窗维护",
            actions: "点击 · 查询/重置/查看/快捷编辑/选择关联\n输入失焦 · 无"
          },
          brief: "后台筛选商品，并用展示、表单、列表三类弹窗维护。"
        },
        {
          id: "PAGE-AD-002",
          name: "商品表单",
          module: "商品",
          file: "PAGE-AD-002.html",
          tabBarExempt: true,
          comps: [],
          spec: {
            layout: "D1-2：名称、售价、库存状态下拉、上架日期、上架时间、简介；保存/取消。",
            comps: "无",
            apis: "API-AD-003 · 保存商品\n点击保存。",
            features: "FEATURE-002 · 整页表单保存",
            actions: "点击 · 保存回列表、取消回列表\n输入失焦 · 无"
          },
          brief: "整页录入商品并保存后返回列表。"
        }
      ]
    };
  </script>
  <script src="assets/md-icons.js"></script>
  <script src="assets/icons-extra.js"></script>
  <script src="assets/proto-shell.js"></script>
</body>
</html>
