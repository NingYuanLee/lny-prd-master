<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PAGE-MP-001 首页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-immersive">
    <div class="md-hero" data-section="Banner">
      <div class="md-swiper">
        <div class="md-swiper__track">
          <div class="md-swiper__slide md-media-ph md-media-ph--1">
            <p class="md-hero__slogan">季节鲜选</p>
            <p class="md-hero__sub">当季水果直达</p>
          </div>
          <div class="md-swiper__slide md-media-ph md-media-ph--3">
            <p class="md-hero__slogan">季节鲜选</p>
            <p class="md-hero__sub">手冲与冷萃</p>
          </div>
          <div class="md-swiper__slide md-media-ph md-media-ph--5">
            <p class="md-hero__slogan">季节鲜选</p>
            <p class="md-hero__sub">烘焙刚出炉</p>
          </div>
        </div>
        <div class="md-swiper__dots"></div>
      </div>
    </div>
    <main class="md-mobile-body">
      <nav class="md-king" data-section="金刚区" aria-label="分类">
        <button type="button" class="md-king__item" data-cat="全部">
          <span class="md-king__icon"><span class="md-icon" data-icon="category" aria-hidden="true"></span></span>
          全部
        </button>
        <button type="button" class="md-king__item" data-cat="水果">
          <span class="md-king__icon"><span class="md-icon" data-icon="goods" aria-hidden="true"></span></span>
          水果
        </button>
        <button type="button" class="md-king__item" data-cat="饮品">
          <span class="md-king__icon"><span class="md-icon" data-icon="star" aria-hidden="true"></span></span>
          饮品
        </button>
        <button type="button" class="md-king__item" data-cat="烘焙">
          <span class="md-king__icon"><span class="md-icon" data-icon="home" aria-hidden="true"></span></span>
          烘焙
        </button>
        <button type="button" class="md-king__item" data-cat="坚果">
          <span class="md-king__icon"><span class="md-icon" data-icon="cart" aria-hidden="true"></span></span>
          坚果
        </button>
      </nav>
      <nav class="md-king md-king--pair" data-section="金刚区" aria-label="专题入口">
        <button type="button" class="md-king__item" data-cat="时令鲜果">
          <span class="md-king__icon"><span class="md-icon" data-icon="goods" aria-hidden="true"></span></span>
          <span class="md-king__name">时令鲜果</span>
          <span class="md-king__desc">当季直达</span>
        </button>
        <button type="button" class="md-king__item" data-cat="手冲咖啡">
          <span class="md-king__icon"><span class="md-icon" data-icon="star" aria-hidden="true"></span></span>
          <span class="md-king__name">手冲咖啡</span>
          <span class="md-king__desc">现磨冷萃</span>
        </button>
        <button type="button" class="md-king__item" data-cat="烘焙出炉">
          <span class="md-king__icon"><span class="md-icon" data-icon="home" aria-hidden="true"></span></span>
          <span class="md-king__name">烘焙出炉</span>
          <span class="md-king__desc">每日新鲜</span>
        </button>
        <button type="button" class="md-king__item" data-cat="坚果干货">
          <span class="md-king__icon"><span class="md-icon" data-icon="cart" aria-hidden="true"></span></span>
          <span class="md-king__name">坚果干货</span>
          <span class="md-king__desc">罐装便携</span>
        </button>
      </nav>
      <div class="md-section-head">
        <h1 class="md-section-head__title">推荐</h1>
      </div>
      <div class="md-grid-2" data-section="推荐区">
        <article class="md-card" data-comp="COMP-001" data-state="default">
          <div class="md-card__media md-media-ph md-media-ph--1"></div>
          <div class="md-card__body">
            <h2 class="md-card__title">有机草莓 250g</h2>
            <p class="md-price">¥19.90</p>
          </div>
        </article>
        <article class="md-card" data-comp="COMP-001" data-state="default">
          <div class="md-card__media md-media-ph md-media-ph--2"></div>
          <div class="md-card__body">
            <h2 class="md-card__title">云南小粒咖啡 227g</h2>
            <p class="md-price">¥29.90</p>
          </div>
        </article>
        <article class="md-card" data-comp="COMP-001" data-state="default">
          <div class="md-card__media md-media-ph md-media-ph--3"></div>
          <div class="md-card__body">
            <h2 class="md-card__title">青柠蜂蜜茶 500ml</h2>
            <p class="md-price">¥12.50</p>
          </div>
        </article>
        <article class="md-card" data-comp="COMP-001" data-state="default">
          <div class="md-card__media md-media-ph md-media-ph--4"></div>
          <div class="md-card__body">
            <h2 class="md-card__title">全麦吐司 400g</h2>
            <p class="md-price">¥9.90</p>
          </div>
        </article>
      </div>
      <div class="md-skel-host is-hidden" data-skel-for="COMP-001">
        <div class="md-skeleton md-skeleton--media"></div>
        <div class="md-skeleton md-skeleton--title"></div>
        <div class="md-skeleton md-skeleton--text"></div>
      </div>
      <div class="md-empty md-empty--illus is-hidden" data-empty-for="COMP-001" data-empty-text="暂无推荐商品" data-error-text="推荐加载失败">
        <div class="md-empty__art" aria-hidden="true"></div>
        <p class="md-empty__title">暂无内容</p>
        <p class="md-empty__text">暂无推荐商品</p>
      </div>
    </main>
    <nav class="md-tabbar">
      <a class="is-active" href="PAGE-MP-001.html">
        <span class="md-icon" data-icon="home" aria-hidden="true"></span>
        <span>首页</span>
      </a>
      <a href="PAGE-MP-002.html">
        <span class="md-icon" data-icon="goods" aria-hidden="true"></span>
        <span>商品</span>
      </a>
    </nav>
    <div id="catSheetBackdrop" class="md-backdrop" onclick="ProtoPage.closeDrawer('catSheet')"></div>
    <aside id="catSheet" class="md-drawer md-drawer--bottom" aria-hidden="true">
      <h2 class="md-drawer__title">分类</h2>
      <div class="md-drawer__body">
        <p class="md-body2" id="catHint">选择分类后可前往商品列表。</p>
      </div>
      <div class="md-drawer__actions">
        <button type="button" class="md-btn md-btn--text" onclick="ProtoPage.closeDrawer('catSheet')">取消</button>
        <a class="md-btn md-btn--contained" href="PAGE-MP-002.html">去商品列表</a>
      </div>
    </aside>
  </div>
  <script src="assets/md-icons.js"></script>
  <script src="assets/icons-extra.js"></script>
  <script src="assets/proto-page.js"></script>
  <script>
    document.querySelectorAll(".md-king__item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var name = btn.getAttribute("data-cat") || "分类";
        document.getElementById("catHint").textContent = "当前分类：" + name;
        ProtoPage.openDrawer("catSheet");
        ProtoPage.snackbar("已选择分类");
      });
    });
  </script>
</body>
</html>
