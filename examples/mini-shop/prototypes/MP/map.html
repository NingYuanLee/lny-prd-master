<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>MP 关系图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/mui-kit.css">
  <link rel="stylesheet" href="./assets/proto-shell.css">
</head>
<body>
  <div id="map-shell">
    <header class="md-appbar">
      <div class="md-appbar__title">关系图</div>
      <a class="md-btn md-btn--text" href="./index.html">单页预览</a>
      <button type="button" class="md-btn md-btn--text" id="btnFit">适应</button>
      <button type="button" class="md-btn md-btn--text" id="btnReset">重置布局</button>
      <button type="button" class="md-btn md-btn--text" id="btnExport">导出图片</button>
      <button type="button" class="md-btn md-btn--text" id="btnFull">全屏</button>
    </header>
    <div id="viewport">
      <div id="world">
        <svg id="connections" width="2000" height="2000"></svg>
      </div>
    </div>
    <div id="map-legend" class="map-legend"></div>
  </div>
  <script src="./assets/proto-map.js"></script>
  <script>
    ProtoMap.boot({
      project: "mini-shop",
      terminal: "MP",
      pages: [
        { id: "PAGE-MP-001", name: "首页", module: "首页", file: "./PAGE-MP-001.html", x: 80, y: 80 },
        { id: "PAGE-MP-002", name: "商品列表", module: "商品", file: "./PAGE-MP-002.html", x: 400, y: 80 },
        { id: "PAGE-MP-003", name: "商品详情", module: "商品", file: "./PAGE-MP-003.html", x: 400, y: 680 }
      ],
      links: [
        { from: "PAGE-MP-001", to: "PAGE-MP-002", type: "tab", label: "TabBar" },
        { from: "PAGE-MP-002", to: "PAGE-MP-001", type: "tab", label: "TabBar" },
        { from: "PAGE-MP-001", to: "PAGE-MP-002", type: "forward", label: "去商品列表" },
        { from: "PAGE-MP-002", to: "PAGE-MP-003", type: "forward", label: "商品卡片" },
        { from: "PAGE-MP-003", to: "PAGE-MP-002", type: "back", label: "返回" }
      ]
    });
  </script>
</body>
</html>
