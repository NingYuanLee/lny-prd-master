<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PAGE-MP-001 首页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page">
    <header class="md-appbar md-appbar--mobile">
      <div class="md-appbar__title">首页</div>

    <main class="md-mobile-body">
      <h1 class="md-h3" style="margin-bottom:16px">推荐</h1>

        <article class="md-card" data-comp="COMP-001" data-state="default">

            <h2 class="md-card__title">示例商品 A</h2>
            <p class="md-price">¥19.9</p>

            <h2 class="md-card__title">示例商品 B</h2>
            <p class="md-price">¥29.9</p>
          </div>
        </article>
      </div>
      <p class="md-empty is-hidden" data-empty-for="COMP-001" data-empty-text="暂无推荐商品" data-error-text="推荐加载失败"></p>
    </main>
    <nav class="md-tabbar">
      <a class="is-active" href="PAGE-MP-001.html">
        <span class="md-icon" data-icon="home" aria-hidden="true"></span>
