<!-- LNY-PRD gold: 夹具：对标 desktop-split.html。商品·分类树维护；左树右分类表单。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>PAGE-AD-005 商品分类</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-d1 md-d1--split">
    <div class="md-breadcrumb">
      <span>商品</span><span>/</span><span class="is-current">商品分类</span>
    </div>
    <div class="md-split">
      <aside class="md-split__side">
        <div class="md-tree-bar">
          <button type="button" class="md-icon-btn" data-tree-act="expand" title="全部展开" aria-label="全部展开">
            <span class="md-icon" data-icon="unfold" aria-hidden="true"></span>
          </button>
          <button type="button" class="md-icon-btn" data-tree-act="collapse" title="全部收起" aria-label="全部收起">
            <span class="md-icon" data-icon="fold" aria-hidden="true"></span>
          </button>
          <button type="button" class="md-btn md-btn--contained md-btn--sm" data-tree-act="add-root">
            <span class="md-icon" data-icon="add" aria-hidden="true"></span>根节点
          </button>
        </div>
        <ul class="md-tree">
          <li class="is-open">
            <button type="button" class="md-tree__item is-active" data-cat="水果">
              <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
              <span class="md-tree__label">水果</span>
            </button>
            <ul>
              <li class="is-open">
                <button type="button" class="md-tree__item" data-cat="浆果">
                  <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                  <span class="md-tree__label">浆果</span>
                </button>
                <ul>
                  <li>
                    <button type="button" class="md-tree__item" data-cat="草莓">
                      <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                      <span class="md-tree__label">草莓</span>
                    </button>
                  </li>
                  <li>
                    <button type="button" class="md-tree__item" data-cat="蓝莓">
                      <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                      <span class="md-tree__label">蓝莓</span>
                    </button>
                  </li>
                </ul>
              </li>
              <li>
                <button type="button" class="md-tree__item" data-cat="柑橘">
                  <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                  <span class="md-tree__label">柑橘</span>
                </button>
              </li>
            </ul>
          </li>
          <li>
            <button type="button" class="md-tree__item" data-cat="饮品">
              <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
              <span class="md-tree__label">饮品</span>
            </button>
            <ul>
              <li>
                <button type="button" class="md-tree__item" data-cat="咖啡">
                  <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                  <span class="md-tree__label">咖啡</span>
                </button>
              </li>
            </ul>
          </li>
          <li data-leaf>
            <button type="button" class="md-tree__item" data-cat="烘焙">
              <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
              <span class="md-tree__label">烘焙</span>
            </button>
          </li>
        </ul>
      </aside>
      <div class="md-split__main">
        <div class="md-section-head">
          <span class="md-section-head__title" id="catTitle">水果</span>
          <button type="button" class="md-btn md-btn--contained md-btn--sm">保存</button>
        </div>
        <form class="md-d1__form md-split__form" id="catForm">
          <div class="md-form-block md-form-block--cols-2">
            <label class="md-field md-field--sm">
              <span class="md-field__label">分类名称</span>
              <input class="md-field__input" id="fName" type="text" autocomplete="off">
            </label>
            <label class="md-field md-field--sm">
              <span class="md-field__label">分类编码</span>
              <input class="md-field__input" id="fCode" type="text" autocomplete="off">
            </label>
          </div>
          <div class="md-form-block md-form-block--cols-2">
            <label class="md-field md-field--sm">
              <span class="md-field__label">排序</span>
              <input class="md-field__input" id="fSort" type="number" min="0" step="1">
            </label>
            <label class="md-field md-field--sm md-field--readonly">
              <span class="md-field__label">上级分类</span>
              <input class="md-field__input" id="fParent" type="text" readonly tabindex="-1">
            </label>
          </div>
          <label class="md-switch-row">
            <span class="md-switch">
              <input type="checkbox" id="fOn" checked>
              <span class="md-switch__track"></span>
              <span class="md-switch__thumb"></span>
            </span>
            <span>启用</span>
          </label>
          <label class="md-field md-field--sm">
            <span class="md-field__label">说明</span>
            <textarea class="md-field__input" id="fNote" rows="3"></textarea>
          </label>
        </form>
      </div>
    </div>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
  <script>
    (function () {
      var CAT = {
        "水果": { name: "水果", code: "fruit", sort: 10, parent: "—", on: true, note: "一级分类，含浆果与柑橘等子类。" },
        "浆果": { name: "浆果", code: "berry", sort: 1, parent: "水果", on: true, note: "短保、忌挤压。" },
        "草莓": { name: "草莓", code: "strawberry", sort: 1, parent: "浆果", on: true, note: "" },
        "蓝莓": { name: "蓝莓", code: "blueberry", sort: 2, parent: "浆果", on: true, note: "当季新品。" },
        "柑橘": { name: "柑橘", code: "citrus", sort: 2, parent: "水果", on: true, note: "" },
        "饮品": { name: "饮品", code: "drink", sort: 20, parent: "—", on: true, note: "" },
        "咖啡": { name: "咖啡", code: "coffee", sort: 1, parent: "饮品", on: false, note: "云南小粒等。" },
        "烘焙": { name: "烘焙", code: "bakery", sort: 30, parent: "—", on: true, note: "末级示例，data-leaf。" }
      };
      function paintCat(cat) {
        var d = CAT[cat] || CAT["水果"];
        document.getElementById("catTitle").textContent = d.name;
        document.getElementById("fName").value = d.name;
        document.getElementById("fCode").value = d.code;
        document.getElementById("fSort").value = d.sort;
        document.getElementById("fParent").value = d.parent;
        document.getElementById("fOn").checked = d.on;
        document.getElementById("fNote").value = d.note;
      }
      document.addEventListener("md-tree-select", function (ev) {
        paintCat(ev.detail.cat);
      });
      paintCat("水果");
    })();
  </script>
</body>
</html>
