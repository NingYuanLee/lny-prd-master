<!-- LNY-PRD gold: 金样：左树右内容。写分类树/组织树前必 Read。禁止整页刷新换右区。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PAGE-AD-005 分类管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/mui-kit.css">
</head>
<body>
  <div class="md-d1 md-d1--split">
    <div class="md-breadcrumb">
      <span>商品</span><span>/</span><span class="is-current">分类</span>
    </div>
    <div class="md-split">
      <aside class="md-split__side">
        <ul class="md-tree">
          <li><button type="button" class="md-tree__item is-active" data-cat="水果">水果</button>
            <ul>
              <li><button type="button" class="md-tree__item" data-cat="浆果">浆果</button></li>
              <li><button type="button" class="md-tree__item" data-cat="柑橘">柑橘</button></li>
            </ul>
          </li>
          <li><button type="button" class="md-tree__item" data-cat="饮品">饮品</button></li>
          <li><button type="button" class="md-tree__item" data-cat="烘焙">烘焙</button></li>
        </ul>
      </aside>
      <div class="md-split__main">
        <div class="md-section-head"><span class="md-section-head__title" id="catTitle">水果</span></div>
        <div class="md-paper">
          <table class="md-table">
            <thead>
              <tr>
                <th class="md-col-name">商品名称</th>
                <th class="md-col-price">售价</th>
                <th class="md-col-status">状态</th>
              </tr>
            </thead>
            <tbody id="catBody">
              <tr><td class="md-col-name">有机草莓 250g</td><td class="md-col-price">¥19.90</td><td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td></tr>
              <tr><td class="md-col-name">云南小粒咖啡 227g</td><td class="md-col-price">¥29.90</td><td class="md-col-status"><span class="md-chip">缺货</span></td></tr>
              <tr><td class="md-col-name">青柠蜂蜜茶 500ml</td><td class="md-col-price">¥12.50</td><td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td></tr>
              <tr><td class="md-col-name">全麦吐司 400g</td><td class="md-col-price">¥9.90</td><td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td></tr>
            </tbody>
          </table>
          <div class="md-skel-host is-hidden" data-skel-for="COMP-001">
            <div class="md-skeleton md-skeleton--row"></div>
            <div class="md-skeleton md-skeleton--row"></div>
          </div>
          <div class="md-empty md-empty--illus is-hidden" data-empty-for="COMP-001" data-empty-text="该分类暂无商品" data-error-text="加载失败">
            <div class="md-empty__art" aria-hidden="true"></div>
            <p class="md-empty__title">暂无内容</p>
            <p class="md-empty__text">该分类暂无商品</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/md-icons.js"></script>
  <script src="assets/icons-extra.js"></script>
  <script src="assets/proto-page.js"></script>
  <script>
    document.querySelectorAll(".md-tree__item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".md-tree__item").forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        document.getElementById("catTitle").textContent = btn.getAttribute("data-cat");
      });
    });
  </script>
</body>
</html>
