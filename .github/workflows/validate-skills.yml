name: Validate skill package

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate-skill-package.py
      - name: Cache Playwright browser and npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: ${{ runner.os }}-playwright-1.62.1-pngjs-7.0.0
      - run: npm install --no-save --package-lock=false playwright@1.62.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_verify_prototype_browser.mjs
      - run: node lny-prd-prototype/scripts/verify-prototype-browser.mjs examples/mini-shop --artifacts .browser-artifacts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-browser-screenshots
          path: .browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
