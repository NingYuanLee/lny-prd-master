<!-- LNY-PRD gold: 金样：桌面向导。数字步骤与分段进步条二选一；当前步表单，最后一步才提交。数字步骤可点跳步。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>PAGE-AD-003 步骤向导</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-d1">
    <div class="md-breadcrumb">
      <span>商品</span><span>/</span><span class="is-current">步骤向导</span>
    </div>
    <p class="md-body2">数字步骤（<code>md-stepper</code>）与分段进步条（<code>md-advance</code>）是两种独立导航形态，业务页只选其一，禁止同屏叠加。下方签仅用于金样对照两种写法。</p>
    <nav class="md-tabs md-tabs--page">
      <button type="button" class="md-tab is-active" data-panel="wizStepper">数字步骤</button>
      <button type="button" class="md-tab" data-panel="wizAdvance">分段进步条</button>
    </nav>
    <div class="md-tab-panels">
      <div id="wizStepper" class="md-tab-panel is-active" data-wizard-host>
        <div class="md-stepper">
          <div class="md-step is-active" data-step="1">基本信息</div>
          <div class="md-step" data-step="2">售卖设置</div>
          <div class="md-step" data-step="3">确认提交</div>
        </div>
        <form class="md-d1__form">
          <div data-step="0">
            <label class="md-field md-field--sm"><span class="md-field__label">商品名称</span><input class="md-field__input" type="text" placeholder="请输入商品名称"></label>
            <label class="md-field md-field--sm"><span class="md-field__label">售价</span><input class="md-field__input" type="text" placeholder="请输入售价"></label>
          </div>
          <div data-step="1" hidden>
            <label class="md-field md-field--sm md-field--select"><span class="md-field__label">库存状态</span><select class="md-select"><option>有货</option><option>缺货</option></select></label>
            <label class="md-switch-row"><span class="md-switch"><input type="checkbox" checked><span class="md-switch__track"></span><span class="md-switch__thumb"></span></span><span>上架</span></label>
          </div>
          <div data-step="2" hidden>
            <p class="md-body2">确认名称、售价与上架状态无误后提交。</p>
          </div>
          <div class="md-btn-group">
            <button type="button" class="md-btn md-btn--text" data-wizard-prev>上一步</button>
            <button type="button" class="md-btn md-btn--contained" data-wizard-next>下一步</button>
          </div>
        </form>
      </div>
      <div id="wizAdvance" class="md-tab-panel" data-wizard-host>
        <div class="md-advance" data-segments="3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33">
          <div class="md-advance__head">
            <span class="md-advance__label">完成进度</span>
            <span class="md-advance__value">1 / 3</span>
          </div>
          <div class="md-advance__track">
            <div class="md-advance__seg"><div class="md-advance__bar" style="width:100%"></div></div>
            <div class="md-advance__seg"><div class="md-advance__bar" style="width:0%"></div></div>
            <div class="md-advance__seg"><div class="md-advance__bar" style="width:0%"></div></div>
          </div>
        </div>
        <form class="md-d1__form">
          <div data-step="0">
            <label class="md-field md-field--sm"><span class="md-field__label">商品名称</span><input class="md-field__input" type="text" placeholder="请输入商品名称"></label>
            <label class="md-field md-field--sm"><span class="md-field__label">售价</span><input class="md-field__input" type="text" placeholder="请输入售价"></label>
          </div>
          <div data-step="1" hidden>
            <label class="md-field md-field--sm md-field--select"><span class="md-field__label">库存状态</span><select class="md-select"><option>有货</option><option>缺货</option></select></label>
            <label class="md-switch-row"><span class="md-switch"><input type="checkbox" checked><span class="md-switch__track"></span><span class="md-switch__thumb"></span></span><span>上架</span></label>
          </div>
          <div data-step="2" hidden>
            <p class="md-body2">确认名称、售价与上架状态无误后提交。</p>
          </div>
          <div class="md-btn-group">
            <button type="button" class="md-btn md-btn--text" data-wizard-prev>上一步</button>
            <button type="button" class="md-btn md-btn--contained" data-wizard-next>下一步</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
</body>
</html>
