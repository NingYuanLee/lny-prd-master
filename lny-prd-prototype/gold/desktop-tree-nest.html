<!-- LNY-PRD gold: 分页树形列表（六型之二）：表内父子嵌套行。六型总览见 desktop-lists。只读树见该页第四签；维护树见 desktop-split。写嵌套表前必 Read。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌面表内嵌套树</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-d1 md-d1--list">
    <div class="md-breadcrumb">
      <span>套件</span><span>/</span><span class="is-current">表内嵌套</span>
    </div>
    <p class="md-body2">分页树形列表：父子行缩进。六型总览见 desktop-lists。分类定位见 desktop-locator，不要混用。</p>
    <div class="md-d1__list">
      <div class="md-table-wrap">
        <table class="md-table md-table--nest">
          <thead>
            <tr>
              <th class="md-col-name">名称</th>
              <th class="md-col-status">状态</th>
              <th class="md-col-num">数量</th>
              <th class="md-col-actions">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr data-row-id="fruit">
              <td class="md-col-name">
                <button type="button" class="md-nest-toggle" aria-expanded="true" aria-label="展开收起"><span class="md-icon" data-icon="chevron-right" aria-hidden="true"></span></button>
                水果
              </td>
              <td class="md-col-status"><span class="md-chip md-chip--success">启用</span></td>
              <td class="md-col-num">2</td>
              <td class="md-col-actions"><div class="md-actions">
                <button type="button" class="md-icon-btn" title="编辑" aria-label="编辑"><span class="md-icon" data-icon="edit" aria-hidden="true"></span></button>
              </div></td>
            </tr>
            <tr class="md-row--child" data-parent="fruit">
              <td class="md-col-name">有机草莓 250g</td>
              <td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td>
              <td class="md-col-num">120</td>
              <td class="md-col-actions"><div class="md-actions">
                <button type="button" class="md-icon-btn" title="查看" aria-label="查看"><span class="md-icon" data-icon="view" aria-hidden="true"></span></button>
                <button type="button" class="md-icon-btn" title="编辑" aria-label="编辑"><span class="md-icon" data-icon="edit" aria-hidden="true"></span></button>
              </div></td>
            </tr>
            <tr class="md-row--child" data-parent="fruit">
              <td class="md-col-name">
                <div class="md-cell-stack">
                  <span class="md-cell-stack__primary">赣南脐橙 5斤 · 超长名称演示省略避免叠列</span>
                  <span class="md-cell-stack__secondary">产地直发 · 冷链</span>
                </div>
              </td>
              <td class="md-col-status"><span class="md-chip">缺货</span></td>
              <td class="md-col-num">0</td>
              <td class="md-col-actions"><div class="md-actions">
                <button type="button" class="md-icon-btn" title="查看" aria-label="查看"><span class="md-icon" data-icon="view" aria-hidden="true"></span></button>
                <button type="button" class="md-icon-btn" title="编辑" aria-label="编辑"><span class="md-icon" data-icon="edit" aria-hidden="true"></span></button>
              </div></td>
            </tr>
            <tr data-row-id="drink">
              <td class="md-col-name">
                <button type="button" class="md-nest-toggle" aria-expanded="true" aria-label="展开收起"><span class="md-icon" data-icon="chevron-right" aria-hidden="true"></span></button>
                饮品
              </td>
              <td class="md-col-status"><span class="md-chip md-chip--success">启用</span></td>
              <td class="md-col-num">1</td>
              <td class="md-col-actions"><div class="md-actions">
                <button type="button" class="md-icon-btn" title="编辑" aria-label="编辑"><span class="md-icon" data-icon="edit" aria-hidden="true"></span></button>
              </div></td>
            </tr>
            <tr class="md-row--child" data-parent="drink">
              <td class="md-col-name">云南小粒咖啡 227g</td>
              <td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td>
              <td class="md-col-num">48</td>
              <td class="md-col-actions"><div class="md-actions">
                <button type="button" class="md-icon-btn" title="查看" aria-label="查看"><span class="md-icon" data-icon="view" aria-hidden="true"></span></button>
                <div class="md-select-wrap">
                  <button type="button" class="md-icon-btn" title="更多" aria-label="更多" data-menu="nestMore1"><span class="md-icon" data-icon="more" aria-hidden="true"></span></button>
                  <ul id="nestMore1" class="md-menu md-menu--right md-menu--fixed">
                    <li><button type="button" class="md-menu__item">编辑</button></li>
                    <li><button type="button" class="md-menu__item">下架</button></li>
                  </ul>
                </div>
              </div></td>
            </tr>
            <tr class="md-row--child" data-parent="drink">
              <td class="md-col-name">青柠蜂蜜茶 500ml</td>
              <td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td>
              <td class="md-col-num">36</td>
              <td class="md-col-actions"><div class="md-actions">
                <button type="button" class="md-icon-btn" title="查看" aria-label="查看"><span class="md-icon" data-icon="view" aria-hidden="true"></span></button>
              </div></td>
            </tr>
          </tbody>
        </table>
        <div class="md-skel-host is-hidden" data-skel-for="COMP-001">
          <div class="md-skeleton md-skeleton--row"></div>
          <div class="md-skeleton md-skeleton--row"></div>
        </div>
        <div class="md-empty md-empty--illus is-hidden" data-empty-for="COMP-001" data-empty-text="暂无分类商品" data-error-text="加载失败">
          <div class="md-empty__art" aria-hidden="true"></div>
          <p class="md-empty__title">暂无内容</p>
          <p class="md-empty__text">该分类下还没有商品</p>
        </div>
      </div>
      <div class="md-d1__footer">
        <span class="md-d1__stats md-caption">共 6 条</span>
        <div class="md-d1__pager"><nav class="md-pagination" aria-label="分页"><button type="button" class="md-page-btn is-active">1</button></nav></div>
      </div>
    </div>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
</body>
</html>
