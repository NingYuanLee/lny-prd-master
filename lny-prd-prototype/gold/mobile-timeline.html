<!-- LNY-PRD gold: 金样：触屏时间轴。左竖轨右横卡文本（可内嵌多小图）。写触屏时间轴页前必 Read。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>PAGE-MP-009 时间轴</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-standard">
    <header class="md-appbar md-appbar--mobile">
      <a class="md-icon-btn" href="#" aria-label="返回"><span class="md-icon" data-icon="chevron-left"></span></a>
      <h1 class="md-appbar__title">时间轴</h1>
    </header>
    <main class="md-mobile-body">
      <div class="md-mobile-sheet">
      <section class="md-module">
        <div class="md-section-head">
          <h2 class="md-section-head__title">节点记录</h2>
        </div>
        <ol class="md-timeline">
          <li class="md-timeline__item is-done">
            <div class="md-timeline__rail" aria-hidden="true">
              <span class="md-timeline__node"></span>
              <span class="md-timeline__line"></span>
            </div>
            <article class="md-timeline__body md-card md-card--row">
              <div class="md-card__body">
                <div class="md-card__main">
                  <h2 class="md-card__title">已提交</h2>
                  <p class="md-card__text">申请已进入审核队列，本节点仅展示文本摘要，无需左侧大图。</p>
                </div>
                <div class="md-card__foot">
                  <div class="md-card__meta">
                    <span class="md-card__meta-item"><span class="md-icon" data-icon="schedule" aria-hidden="true"></span>08-10 09:20</span>
                  </div>
                </div>
              </div>
            </article>
          </li>
          <li class="md-timeline__item is-active">
            <div class="md-timeline__rail" aria-hidden="true">
              <span class="md-timeline__node"></span>
              <span class="md-timeline__line"></span>
            </div>
            <article class="md-timeline__body md-card md-card--row">
              <div class="md-card__body">
                <div class="md-card__main">
                  <h2 class="md-card__title">审核中</h2>
                  <p class="md-card__text">左侧竖轨标记当前节点；正文下方可附带多张缩略图。</p>
                </div>
                <div class="md-card__photos">
                  <div class="md-card__photo md-media-ph md-media-ph--2"></div>
                  <div class="md-card__photo md-media-ph md-media-ph--3"></div>
                  <div class="md-card__photo md-media-ph md-media-ph--4"></div>
                </div>
                <div class="md-card__foot">
                  <div class="md-card__meta">
                    <span class="md-card__meta-item"><span class="md-icon" data-icon="schedule" aria-hidden="true"></span>08-12 14:06</span>
                  </div>
                </div>
              </div>
            </article>
          </li>
          <li class="md-timeline__item">
            <div class="md-timeline__rail" aria-hidden="true">
              <span class="md-timeline__node"></span>
              <span class="md-timeline__line"></span>
            </div>
            <article class="md-timeline__body md-card md-card--row">
              <div class="md-card__body">
                <div class="md-card__main">
                  <h2 class="md-card__title">待发布</h2>
                  <p class="md-card__subtitle">审核通过，等待对外展示</p>
                </div>
                <div class="md-card__foot">
                  <div class="md-card__meta">
                    <span class="md-card__meta-item"><span class="md-icon" data-icon="schedule" aria-hidden="true"></span>08-13 10:00</span>
                  </div>
                </div>
              </div>
            </article>
          </li>
          <li class="md-timeline__item">
            <div class="md-timeline__rail" aria-hidden="true">
              <span class="md-timeline__node"></span>
              <span class="md-timeline__line"></span>
            </div>
            <article class="md-timeline__body md-card md-card--row">
              <div class="md-card__body">
                <div class="md-card__main">
                  <h2 class="md-card__title">已完成</h2>
                  <p class="md-card__text">末节点不再向下连线；点任意节点可切换当前高亮。</p>
                </div>
                <div class="md-card__photos">
                  <div class="md-card__photo md-media-ph md-media-ph--5"></div>
                  <div class="md-card__photo md-media-ph md-media-ph--6"></div>
                </div>
                <div class="md-card__foot">
                  <div class="md-card__meta">
                    <span class="md-card__meta-item"><span class="md-icon" data-icon="schedule" aria-hidden="true"></span>—</span>
                  </div>
                </div>
              </div>
            </article>
          </li>
        </ol>
      </section>
      </div>
    </main>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
</body>
</html>
