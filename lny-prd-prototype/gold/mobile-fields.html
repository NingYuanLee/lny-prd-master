<!-- LNY-PRD gold: 字段列表（= 桌面 lists 第三签 / MP-012）。列表族·无分页·按组堆叠字段；mini-shop 夹具示范单商品多维度（基础/营养/口感等）。不是图文详情，不是横卡列表。 DOM：body > md-mobile-sheet（默认 safe-x）+ md-group-list。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>PAGE-MP-012 字段列表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-standard">
    <header class="md-appbar md-appbar--mobile">
      <a class="md-icon-btn" href="./PAGE-MP-002.html" aria-label="返回">
        <span class="md-icon" data-icon="chevron-left" aria-hidden="true"></span>
      </a>
      <h1 class="md-appbar__title">字段列表</h1>
    </header>
    <main class="md-mobile-body">
      <div class="md-mobile-sheet">
        <div class="md-group-list" data-section="字段列表">
          <section class="md-group-list__group">
            <div class="md-group-list__head">基础信息</div>
            <article class="md-group-list__item">
              <dl class="md-desc">
                <div class="md-desc__row">
                  <dt class="md-desc__label">商品名称</dt>
                  <dd class="md-desc__value">有机草莓 250g</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">规格</dt>
                  <dd class="md-desc__value">盒装 · 约 12–15 颗</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">产地</dt>
                  <dd class="md-desc__value">辽宁丹东</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">保质期</dt>
                  <dd class="md-desc__value">冷藏 5 天</dd>
                </div>
              </dl>
            </article>
          </section>
          <section class="md-group-list__group">
            <div class="md-group-list__head">营养成分</div>
            <article class="md-group-list__item">
              <dl class="md-desc">
                <div class="md-desc__row">
                  <dt class="md-desc__label">计量基准</dt>
                  <dd class="md-desc__value">每 100g 可食部分</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">热量</dt>
                  <dd class="md-desc__value">32 kcal</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">蛋白质</dt>
                  <dd class="md-desc__value">0.7 g</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">维生素 C</dt>
                  <dd class="md-desc__value">58 mg</dd>
                </div>
              </dl>
            </article>
            <article class="md-group-list__item">
              <dl class="md-desc">
                <div class="md-desc__row">
                  <dt class="md-desc__label">计量基准</dt>
                  <dd class="md-desc__value">每份（250g）</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">热量</dt>
                  <dd class="md-desc__value">80 kcal</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">膳食纤维</dt>
                  <dd class="md-desc__value">5.0 g</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">碳水化合物</dt>
                  <dd class="md-desc__value">19.3 g</dd>
                </div>
              </dl>
            </article>
          </section>
          <section class="md-group-list__group">
            <div class="md-group-list__head">口感</div>
            <article class="md-group-list__item">
              <dl class="md-desc">
                <div class="md-desc__row">
                  <dt class="md-desc__label">甜度</dt>
                  <dd class="md-desc__value">★★★★☆</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">酸度</dt>
                  <dd class="md-desc__value">★★☆☆☆</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">质地</dt>
                  <dd class="md-desc__value">饱满多汁、颗粒均匀</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">风味</dt>
                  <dd class="md-desc__value">果香浓郁，带轻微奶香</dd>
                </div>
              </dl>
            </article>
          </section>
          <section class="md-group-list__group">
            <div class="md-group-list__head">储存与食用</div>
            <article class="md-group-list__item">
              <dl class="md-desc">
                <div class="md-desc__row">
                  <dt class="md-desc__label">储存温度</dt>
                  <dd class="md-desc__value">0–4℃ 冷藏</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">建议食用</dt>
                  <dd class="md-desc__value">清洗后鲜食或做沙拉</dd>
                </div>
                <div class="md-desc__row">
                  <dt class="md-desc__label">最佳赏味期</dt>
                  <dd class="md-desc__value">收货后 3 天内</dd>
                </div>
              </dl>
            </article>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
</body>
</html>
