<!-- LNY-PRD gold: 金样：触屏父子章节列表。父章可展开/收起子章；可跳转或滚锚点；不是维护树、不是横卡。写章节目录/大纲列表前必 Read。 DOM：body > md-mobile-sheet（默认 safe-x）+ md-chapter-list。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>触屏父子章节列表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-standard">
    <header class="md-appbar md-appbar--mobile">
      <a class="md-icon-btn" href="#" aria-label="返回"><span class="md-icon" data-icon="chevron-left"></span></a>
      <h1 class="md-appbar__title">课程目录</h1>
    </header>
    <main class="md-mobile-body">
      <div class="md-mobile-sheet">
        <section class="md-module">
          <nav class="md-chapter-list" aria-label="章节目录">
            <div class="md-chapter-list__group is-open">
              <div class="md-chapter-list__head">
                <button type="button" class="md-chapter-list__toggle md-icon-btn" aria-expanded="true" aria-label="收起子章节">
                  <span class="md-icon" data-icon="chevron-right"></span>
                </button>
                <a class="md-chapter-list__parent" href="#ch1">第一章 产品概览</a>
              </div>
              <div class="md-chapter-list__body">
                <a class="md-chapter-list__child" href="#ch1-1">1.1 背景与目标</a>
                <a class="md-chapter-list__child" href="#ch1-2">1.2 适用人群</a>
              </div>
            </div>
            <div class="md-chapter-list__group is-open">
              <div class="md-chapter-list__head">
                <button type="button" class="md-chapter-list__toggle md-icon-btn" aria-expanded="true" aria-label="收起子章节">
                  <span class="md-icon" data-icon="chevron-right"></span>
                </button>
                <a class="md-chapter-list__parent" href="#ch2">第二章 功能说明</a>
              </div>
              <div class="md-chapter-list__body">
                <a class="md-chapter-list__child" href="#ch2-1">2.1 列表与筛选</a>
                <a class="md-chapter-list__child" href="#ch2-2">2.2 表单与提交</a>
                <a class="md-chapter-list__child" href="#ch2-3">2.3 半屏与弹窗</a>
              </div>
            </div>
            <div class="md-chapter-list__group">
              <div class="md-chapter-list__head">
                <button type="button" class="md-chapter-list__toggle md-icon-btn" aria-expanded="false" aria-label="展开子章节">
                  <span class="md-icon" data-icon="chevron-right"></span>
                </button>
                <a class="md-chapter-list__parent" href="#ch3">第三章 常见问题</a>
              </div>
              <div class="md-chapter-list__body">
                <a class="md-chapter-list__child" href="#ch3-1">3.1 账号与权限</a>
              </div>
            </div>
          </nav>
        </section>
      </div>
    </main>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
</body>
</html>
