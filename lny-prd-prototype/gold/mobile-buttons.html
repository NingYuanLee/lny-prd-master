<!-- LNY-PRD gold: 金样：触屏按钮三档尺寸。每档含线框、色块、线框置灰、色块置灰、带角标。写按钮前对照本页。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PAGE-MP-007 按钮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-standard">
    <header class="md-appbar md-appbar--mobile">
      <a class="md-icon-btn" href="#" aria-label="返回"><span class="md-icon" data-icon="chevron-left"></span></a>
      <h1 class="md-appbar__title">按钮</h1>
    </header>
    <main class="md-mobile-body">
      <section class="md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">小</h2>
        </div>
        <div class="md-btn-demo__row">
          <button type="button" class="md-btn md-btn--outlined md-btn--sm">线框</button>
          <button type="button" class="md-btn md-btn--contained md-btn--sm">色块</button>
          <button type="button" class="md-btn md-btn--outlined md-btn--sm" disabled>线框置灰</button>
          <button type="button" class="md-btn md-btn--contained md-btn--sm" disabled>色块置灰</button>
          <button type="button" class="md-btn md-btn--contained md-btn--sm">角标<span class="md-badge">8</span></button>
        </div>
      </section>
      <section class="md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">中</h2>
        </div>
        <div class="md-btn-demo__row">
          <button type="button" class="md-btn md-btn--outlined">线框</button>
          <button type="button" class="md-btn md-btn--contained">色块</button>
          <button type="button" class="md-btn md-btn--outlined" disabled>线框置灰</button>
          <button type="button" class="md-btn md-btn--contained" disabled>色块置灰</button>
          <button type="button" class="md-btn md-btn--contained">角标<span class="md-badge">8</span></button>
        </div>
      </section>
      <section class="md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">大</h2>
        </div>
        <div class="md-btn-demo__row">
          <button type="button" class="md-btn md-btn--outlined md-btn--lg">线框</button>
          <button type="button" class="md-btn md-btn--contained md-btn--lg">色块</button>
          <button type="button" class="md-btn md-btn--outlined md-btn--lg" disabled>线框置灰</button>
          <button type="button" class="md-btn md-btn--contained md-btn--lg" disabled>色块置灰</button>
          <button type="button" class="md-btn md-btn--contained md-btn--lg">角标<span class="md-badge">8</span></button>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/md-icons.js"></script>
  <script src="assets/icons-extra.js"></script>
  <script src="assets/proto-page.js"></script>
</body>
</html>
