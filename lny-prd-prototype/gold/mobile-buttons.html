<!-- LNY-PRD gold: 金样：触屏按钮三档尺寸 + 浅底色字 + 纯文字链接钮 + 通栏整行 + 页签按钮组。每档含线框、色块、浅底、文字、置灰、角标。写按钮前对照本页。 DOM：body > md-mobile-sheet（默认 safe-x）。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>PAGE-MP-007 按钮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-standard">
    <header class="md-appbar md-appbar--mobile">
      <a class="md-icon-btn" href="#" aria-label="返回"><span class="md-icon" data-icon="chevron-left"></span></a>
      <h1 class="md-appbar__title">按钮</h1>
    </header>
    <main class="md-mobile-body">
      <div class="md-mobile-sheet">
      <section class="md-module md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">小</h2>
        </div>
        <div class="md-btn-demo__row">
          <button type="button" class="md-btn md-btn--outlined md-btn--sm">线框</button>
          <button type="button" class="md-btn md-btn--contained md-btn--sm">色块</button>
          <button type="button" class="md-btn md-btn--soft md-btn--sm">浅底</button>
          <button type="button" class="md-btn md-btn--text md-btn--sm">文字</button>
          <button type="button" class="md-btn md-btn--outlined md-btn--sm" disabled>线框置灰</button>
          <button type="button" class="md-btn md-btn--contained md-btn--sm" disabled>色块置灰</button>
          <button type="button" class="md-btn md-btn--soft md-btn--sm" disabled>浅底置灰</button>
          <button type="button" class="md-btn md-btn--contained md-btn--sm">角标<span class="md-badge">8</span></button>
        </div>
      </section>
      <section class="md-module md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">中</h2>
        </div>
        <div class="md-btn-demo__row">
          <button type="button" class="md-btn md-btn--outlined">线框</button>
          <button type="button" class="md-btn md-btn--contained">色块</button>
          <button type="button" class="md-btn md-btn--soft">浅底</button>
          <button type="button" class="md-btn md-btn--text">文字</button>
          <button type="button" class="md-btn md-btn--outlined" disabled>线框置灰</button>
          <button type="button" class="md-btn md-btn--contained" disabled>色块置灰</button>
          <button type="button" class="md-btn md-btn--soft" disabled>浅底置灰</button>
          <button type="button" class="md-btn md-btn--contained">角标<span class="md-badge">8</span></button>
        </div>
      </section>
      <section class="md-module md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">大</h2>
        </div>
        <div class="md-btn-demo__row">
          <button type="button" class="md-btn md-btn--outlined md-btn--lg">线框</button>
          <button type="button" class="md-btn md-btn--contained md-btn--lg">色块</button>
          <button type="button" class="md-btn md-btn--soft md-btn--lg">浅底</button>
          <button type="button" class="md-btn md-btn--text md-btn--lg">文字</button>
          <button type="button" class="md-btn md-btn--outlined md-btn--lg" disabled>线框置灰</button>
          <button type="button" class="md-btn md-btn--contained md-btn--lg" disabled>色块置灰</button>
          <button type="button" class="md-btn md-btn--soft md-btn--lg" disabled>浅底置灰</button>
          <button type="button" class="md-btn md-btn--contained md-btn--lg">角标<span class="md-badge">8</span></button>
        </div>
      </section>
      <section class="md-module md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">通栏（一行一钮）</h2>
        </div>
        <p class="md-body2">一行只有一个主按钮时占满整行：内容区加 md-btn--block；多个通栏竖叠用 md-btn-row。贴底 md-action-bar / 半屏 md-drawer__actions 仅一钮时自动占满。</p>
        <div class="md-btn-row">
          <button type="button" class="md-btn md-btn--contained md-btn--block">提交订单</button>
          <button type="button" class="md-btn md-btn--outlined md-btn--block">继续浏览</button>
          <button type="button" class="md-btn md-btn--soft md-btn--block">稍后再说</button>
        </div>
      </section>
      <section class="md-module md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">纯文字链接</h2>
          <a class="md-btn md-btn--link" href="#">了解更多</a>
        </div>
        <div class="md-btn-demo__row">
          <button type="button" class="md-btn md-btn--link">查看更多</button>
          <button type="button" class="md-btn md-btn--link">了解全部</button>
          <button type="button" class="md-btn md-btn--link">查看全部</button>
          <button type="button" class="md-btn md-btn--link" disabled>不可点</button>
        </div>
        <p class="md-body2">md-btn--link：无线框、无背景、无阴影；分区头「查看全部」也用这一形态，不要做成线框/色块。</p>
      </section>
      <section class="md-module md-btn-demo">
        <div class="md-section-head">
          <h2 class="md-section-head__title">页签</h2>
        </div>
        <nav class="md-tabs">
          <button type="button" class="md-tab is-active" data-panel="tabAll">全部</button>
          <button type="button" class="md-tab" data-panel="tabIn">有货</button>
          <button type="button" class="md-tab" data-panel="tabOut">售罄</button>
        </nav>
        <div class="md-tab-panels">
          <div id="tabAll" class="md-tab-panel is-active">
            <p class="md-body2">触屏页签是一组等宽按钮：未选中浅底色字，选中色块白字。不要做成桌面下划线签。</p>
          </div>
          <div id="tabIn" class="md-tab-panel">
            <p class="md-body2">有货：只列出可售商品。</p>
          </div>
          <div id="tabOut" class="md-tab-panel">
            <p class="md-body2">售罄：只列出已售完商品。</p>
          </div>
        </div>
      </section>
      </div>
    </main>
    <div class="md-action-bar">
      <button type="button" class="md-btn md-btn--contained" onclick="ProtoPage.snackbar('仅一钮时自动占满整行')">确认</button>
    </div>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
</body>
</html>
