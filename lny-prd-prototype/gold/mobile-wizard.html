<!-- LNY-PRD gold: 金样：移动向导。步骤条 + 进步条 + 当前步表单，最后一步才提交。写触屏分步页前必 Read。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PAGE-MP-005 上架向导</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-standard">
    <header class="md-appbar md-appbar--mobile">
      <a class="md-icon-btn" href="#" aria-label="返回"><span class="md-icon" data-icon="chevron-left"></span></a>
      <h1 class="md-appbar__title">上架向导</h1>
    </header>
    <main class="md-mobile-body">
      <div class="md-stepper" id="steps">
        <div class="md-step is-active" data-step="1">基本信息</div>
        <div class="md-step" data-step="2">售卖设置</div>
        <div class="md-step" data-step="3">确认提交</div>
      </div>
      <div class="md-advance md-advance--lg" id="wizProg" data-segments="3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33">
        <div class="md-advance__head">
          <span class="md-advance__label">完成进度</span>
          <span class="md-advance__value">1 / 3</span>
        </div>
        <div class="md-advance__track">
          <div class="md-advance__seg"><div class="md-advance__bar" style="width:100%"></div></div>
          <div class="md-advance__seg"><div class="md-advance__bar" style="width:0%"></div></div>
          <div class="md-advance__seg"><div class="md-advance__bar" style="width:0%"></div></div>
        </div>
      </div>
      <form id="wiz">
        <div data-step="0">
          <label class="md-field"><span class="md-field__label">商品名称</span><input class="md-field__input" id="fName" type="text" placeholder="请输入商品名称"></label>
          <label class="md-field"><span class="md-field__label">售价</span><input class="md-field__input" id="fPrice" type="text" placeholder="请输入售价"></label>
        </div>
        <div data-step="1" hidden>
          <label class="md-field md-field--select"><span class="md-field__label">库存状态</span><select class="md-select" id="fStock"><option>有货</option><option>缺货</option></select></label>
          <label class="md-switch-row"><span class="md-switch"><input type="checkbox" id="fOn" checked><span class="md-switch__track"></span><span class="md-switch__thumb"></span></span><span>上架</span></label>
        </div>
        <div data-step="2" hidden>
          <p class="md-body2">确认名称、售价与上架状态无误后提交。</p>
        </div>
      </form>
    </main>
    <div class="md-action-bar">
      <button type="button" class="md-btn md-btn--text" id="btnPrev">上一步</button>
      <button type="button" class="md-btn md-btn--contained" id="btnNext">下一步</button>
    </div>
  </div>
  <script src="assets/md-icons.js"></script>
  <script src="assets/icons-extra.js"></script>
  <script src="assets/proto-page.js"></script>
  <script>
    var step = 0;
    function paint() {
      document.querySelectorAll("#wiz [data-step]").forEach(function (el) {
        el.hidden = Number(el.getAttribute("data-step")) !== step;
      });
      document.querySelectorAll(".md-step").forEach(function (el, i) {
        el.classList.toggle("is-active", i === step);
      });
      document.getElementById("btnPrev").disabled = step === 0;
      document.getElementById("btnNext").textContent = step === 2 ? "提交" : "下一步";
      ProtoPage.setAdvance("#wizProg", ((step + 1) / 3) * 100, (step + 1) + " / 3");
    }
    document.getElementById("btnPrev").addEventListener("click", function () {
      if (step > 0) { step -= 1; paint(); }
    });
    document.getElementById("btnNext").addEventListener("click", function () {
      if (step < 2) { step += 1; paint(); return; }
      ProtoPage.snackbar("已提交");
    });
    paint();
  </script>
</body>
</html>
