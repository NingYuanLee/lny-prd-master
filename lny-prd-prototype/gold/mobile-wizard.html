<!-- LNY-PRD gold: 金样：触屏步骤向导。数字步骤 / 分段进步 / 无极进度三选一；当前步表单，最后一步才提交。写触屏分步页前必 Read。 DOM：body > md-mobile-sheet（md-form-page 自动 lr0）。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>PAGE-MP-005 步骤向导</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-standard md-form-page">
    <header class="md-appbar md-appbar--mobile">
      <a class="md-icon-btn" href="#" aria-label="返回"><span class="md-icon" data-icon="chevron-left"></span></a>
      <h1 class="md-appbar__title">步骤向导</h1>
    </header>
    <main class="md-mobile-body">
      <div class="md-mobile-sheet">
      <p class="md-body2" style="margin:0 0 12px">数字步骤、分段进步条、无极进度条是三种独立导航形态，业务页只选其一。下方签仅用于金样对照。</p>
      <nav class="md-tabs">
        <button type="button" class="md-tab is-active" data-panel="mWizStepper">数字步骤</button>
        <button type="button" class="md-tab" data-panel="mWizAdvance">分段进步</button>
        <button type="button" class="md-tab" data-panel="mWizProgress">无极进度</button>
      </nav>
      <div class="md-tab-panels">
        <div id="mWizStepper" class="md-tab-panel is-active" data-wizard-panel="stepper">
          <section class="md-module">
            <div class="md-stepper">
              <div class="md-step is-active" data-step="1">第一步</div>
              <div class="md-step" data-step="2">第二步</div>
              <div class="md-step" data-step="3">第三步</div>
            </div>
          </section>
          <section class="md-module">
            <div class="md-section-head"><h2 class="md-section-head__title">当前步骤</h2></div>
            <form class="md-wiz-form">
              <div data-step="0">
                <label class="md-field"><span class="md-field__label">名称</span><input class="md-field__input" type="text" placeholder="请输入名称"></label>
                <label class="md-field"><span class="md-field__label">说明</span><textarea class="md-field__input" rows="3" placeholder="选填说明"></textarea></label>
              </div>
              <div data-step="1" hidden>
                <label class="md-field md-field--select"><span class="md-field__label">选项</span><select class="md-select"><option>方案甲</option><option>方案乙</option></select></label>
                <label class="md-switch-row"><span class="md-switch"><input type="checkbox" checked><span class="md-switch__track"></span><span class="md-switch__thumb"></span></span><span>启用</span></label>
              </div>
              <div data-step="2" hidden>
                <p class="md-body2">确认前两步内容无误后提交。</p>
              </div>
            </form>
          </section>
        </div>
        <div id="mWizAdvance" class="md-tab-panel" data-wizard-panel="advance">
          <section class="md-module">
            <div class="md-advance md-advance--lg" data-segments="3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33">
              <div class="md-advance__head">
                <span class="md-advance__label">分段进步条</span>
                <span class="md-advance__value">1 / 3</span>
              </div>
              <div class="md-advance__track">
                <div class="md-advance__seg"><div class="md-advance__bar" style="width:100%"></div></div>
                <div class="md-advance__seg"><div class="md-advance__bar" style="width:0%"></div></div>
                <div class="md-advance__seg"><div class="md-advance__bar" style="width:0%"></div></div>
              </div>
            </div>
          </section>
          <section class="md-module">
            <div class="md-section-head"><h2 class="md-section-head__title">当前步骤</h2></div>
            <form class="md-wiz-form">
              <div data-step="0">
                <label class="md-field"><span class="md-field__label">名称</span><input class="md-field__input" type="text" placeholder="请输入名称"></label>
                <label class="md-field"><span class="md-field__label">说明</span><textarea class="md-field__input" rows="3" placeholder="选填说明"></textarea></label>
              </div>
              <div data-step="1" hidden>
                <label class="md-field md-field--select"><span class="md-field__label">选项</span><select class="md-select"><option>方案甲</option><option>方案乙</option></select></label>
                <label class="md-switch-row"><span class="md-switch"><input type="checkbox" checked><span class="md-switch__track"></span><span class="md-switch__thumb"></span></span><span>启用</span></label>
              </div>
              <div data-step="2" hidden>
                <p class="md-body2">确认前两步内容无误后提交。</p>
              </div>
            </form>
          </section>
        </div>
        <div id="mWizProgress" class="md-tab-panel" data-wizard-panel="progress">
          <section class="md-module">
            <div class="md-progress md-progress--lg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33">
              <div class="md-progress__head">
                <span class="md-progress__label">无极进度条</span>
                <span class="md-progress__value">33%</span>
              </div>
              <div class="md-progress__track">
                <div class="md-progress__bar" style="width:33%"></div>
              </div>
            </div>
          </section>
          <section class="md-module">
            <div class="md-section-head"><h2 class="md-section-head__title">当前步骤</h2></div>
            <form class="md-wiz-form">
              <div data-step="0">
                <label class="md-field"><span class="md-field__label">名称</span><input class="md-field__input" type="text" placeholder="请输入名称"></label>
                <label class="md-field"><span class="md-field__label">说明</span><textarea class="md-field__input" rows="3" placeholder="选填说明"></textarea></label>
              </div>
              <div data-step="1" hidden>
                <label class="md-field md-field--select"><span class="md-field__label">选项</span><select class="md-select"><option>方案甲</option><option>方案乙</option></select></label>
                <label class="md-switch-row"><span class="md-switch"><input type="checkbox" checked><span class="md-switch__track"></span><span class="md-switch__thumb"></span></span><span>启用</span></label>
              </div>
              <div data-step="2" hidden>
                <p class="md-body2">确认前两步内容无误后提交。</p>
              </div>
            </form>
          </section>
        </div>
      </div>
      </div>
    </main>
    <div class="md-action-bar">
      <button type="button" class="md-btn md-btn--text" id="btnPrev">上一步</button>
      <button type="button" class="md-btn md-btn--contained" id="btnNext">下一步</button>
    </div>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
  <script>
    (function () {
      var total = 3;
      var steps = { mWizStepper: 0, mWizAdvance: 0, mWizProgress: 0 };
      var activeId = "mWizStepper";

      function activePanel() {
        return document.getElementById(activeId);
      }

      function paint() {
        var host = activePanel();
        if (!host) return;
        var step = steps[activeId];
        var mode = host.getAttribute("data-wizard-panel");
        host.querySelectorAll(".md-wiz-form [data-step]").forEach(function (el) {
          el.hidden = Number(el.getAttribute("data-step")) !== step;
        });
        if (mode === "stepper") {
          host.querySelectorAll(".md-step").forEach(function (el, i) {
            el.classList.toggle("is-active", i === step);
            el.classList.toggle("is-done", i < step);
          });
        }
        if (mode === "advance") {
          ProtoPage.setAdvance(
            host.querySelector(".md-advance"),
            ((step + 1) / total) * 100,
            step + 1 + " / " + total
          );
        }
        if (mode === "progress") {
          ProtoPage.setProgress(host.querySelector(".md-progress"), ((step + 1) / total) * 100);
        }
        document.getElementById("btnPrev").disabled = step === 0;
        document.getElementById("btnNext").textContent = step === total - 1 ? "提交" : "下一步";
      }

      document.querySelectorAll(".md-tabs .md-tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          var id = tab.getAttribute("data-panel");
          if (id) activeId = id;
          paint();
        });
      });
      document.querySelectorAll("#mWizStepper .md-step").forEach(function (el, i) {
        el.addEventListener("click", function () {
          if (activeId !== "mWizStepper") return;
          steps.mWizStepper = i;
          paint();
        });
      });
      document.getElementById("btnPrev").addEventListener("click", function () {
        if (steps[activeId] > 0) {
          steps[activeId] -= 1;
          paint();
        }
      });
      document.getElementById("btnNext").addEventListener("click", function () {
        if (steps[activeId] < total - 1) {
          steps[activeId] += 1;
          paint();
          return;
        }
        ProtoPage.snackbar("已提交");
      });
      paint();
    })();
  </script>
</body>
</html>
