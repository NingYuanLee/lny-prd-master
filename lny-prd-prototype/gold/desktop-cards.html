<!-- LNY-PRD gold: 桌面卡片列表。图文重、非强对齐列时用；不要硬套标准表。四型列表见 desktop-lists。写卡片列表前必 Read。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌面卡片列表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-d1 md-d1--cards">
    <div class="md-breadcrumb">
      <span>套件</span><span>/</span><span class="is-current">卡片列表</span>
    </div>
    <p class="md-body2">条目图文重、不靠列对齐时用卡片栅格。分页标准表 / 树表 / 分组字段 / 只读树见 desktop-lists，不要写进本页。</p>
    <div class="md-d1__toolbar">
      <div class="md-btn-group">
        <button type="button" class="md-btn md-btn--contained">新增</button>
      </div>
    </div>
    <div class="md-card-grid">
      <article class="md-card md-card--tile">
        <div class="md-card__media md-media-ph md-media-ph--1"></div>
        <div class="md-card__body"><h3 class="md-card__title">有机草莓</h3><p class="md-card__text">冷链鲜果，适合图文浏览，不要硬套标准表。</p></div>
      </article>
      <article class="md-card md-card--tile">
        <div class="md-card__media md-media-ph md-media-ph--2"></div>
        <div class="md-card__body"><h3 class="md-card__title">脐橙礼盒</h3><p class="md-card__text">卡片列表默认至少四张，便于对标密度。</p></div>
      </article>
      <article class="md-card md-card--tile">
        <div class="md-card__media md-media-ph md-media-ph--3"></div>
        <div class="md-card__body"><h3 class="md-card__title">小粒咖啡</h3><p class="md-card__text">栅格自适应列数；主操作放在功能栏，不塞进每张卡底下一排字。</p></div>
      </article>
      <article class="md-card md-card--tile">
        <div class="md-card__media md-media-ph md-media-ph--4"></div>
        <div class="md-card__body"><h3 class="md-card__title">全麦吐司</h3><p class="md-card__text">嵌入短表见工作台金样，勿整页套商品表壳。</p></div>
      </article>
    </div>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
</body>
</html>
