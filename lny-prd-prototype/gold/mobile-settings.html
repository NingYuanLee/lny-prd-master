<!-- LNY-PRD gold: 设置项（功能服务）。当页当行直接操作。开关可点；横排多选未选/已选都有圈标；选项面可为文字/图标/图片。沉浸式封面顶栏。写设置页前必 Read。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PAGE-MP-006 设置</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="assets/mui-kit.css">
</head>
<body>
  <div class="md-mobile-page md-mp md-immersive md-set-page">
    <header class="md-appbar md-appbar--mobile md-appbar--cover">
      <div class="md-appbar__cover md-media-ph md-media-ph--2" aria-hidden="true"></div>
      <a class="md-icon-btn" href="#" aria-label="返回"><span class="md-icon" data-icon="back"></span></a>
      <h1 class="md-appbar__title">设置</h1>
    </header>
    <main class="md-mobile-body">
      <section class="md-module">
      <div class="md-set-group">
        <div class="md-set-group__title">通知</div>
        <div class="md-set-row">
          <span class="md-set-row__lead">
            <span class="md-icon" data-icon="mail" aria-hidden="true"></span>
            <span class="md-set-row__label">活动提醒</span>
          </span>
          <span class="md-set-row__trail">
            <label class="md-switch"><input type="checkbox" checked><span class="md-switch__track"></span><span class="md-switch__thumb"></span></label>
          </span>
        </div>
        <div class="md-set-row">
          <span class="md-set-row__lead">
            <span class="md-icon" data-icon="goods" aria-hidden="true"></span>
            <span class="md-set-row__label">到货通知</span>
          </span>
          <span class="md-set-row__trail">
            <label class="md-switch"><input type="checkbox" checked><span class="md-switch__track"></span><span class="md-switch__thumb"></span></label>
          </span>
        </div>
      </div>
      </section>
      <section class="md-module">
      <div class="md-set-group">
        <div class="md-set-group__title">显示</div>
        <div class="md-set-picks" role="radiogroup" aria-label="字号">
          <label class="md-set-pick">
            <input type="radio" name="fontSize" value="标准" checked>
            <span class="md-set-pick__face"><span class="md-set-pick__label">标准</span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
          <label class="md-set-pick">
            <input type="radio" name="fontSize" value="较大">
            <span class="md-set-pick__face"><span class="md-set-pick__label">较大</span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
          <label class="md-set-pick">
            <input type="radio" name="fontSize" value="最大">
            <span class="md-set-pick__face"><span class="md-set-pick__label">最大</span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
        </div>
        <div class="md-set-picks" role="radiogroup" aria-label="列表风格">
          <label class="md-set-pick">
            <input type="radio" name="listStyle" value="列表" checked>
            <span class="md-set-pick__face"><span class="md-icon" data-icon="menu" aria-hidden="true"></span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
          <label class="md-set-pick">
            <input type="radio" name="listStyle" value="双列">
            <span class="md-set-pick__face"><span class="md-icon" data-icon="category" aria-hidden="true"></span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
          <label class="md-set-pick">
            <input type="radio" name="listStyle" value="封面">
            <span class="md-set-pick__face"><span class="md-icon" data-icon="image" aria-hidden="true"></span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
        </div>
        <div class="md-set-picks" role="radiogroup" aria-label="封面示意">
          <label class="md-set-pick">
            <input type="radio" name="coverPick" value="1" checked>
            <span class="md-set-pick__face"><span class="md-set-pick__media md-media-ph md-media-ph--1" role="img" aria-label="封面一"></span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
          <label class="md-set-pick">
            <input type="radio" name="coverPick" value="2">
            <span class="md-set-pick__face"><span class="md-set-pick__media md-media-ph md-media-ph--3" role="img" aria-label="封面二"></span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
          <label class="md-set-pick">
            <input type="radio" name="coverPick" value="3">
            <span class="md-set-pick__face"><span class="md-set-pick__media md-media-ph md-media-ph--5" role="img" aria-label="封面三"></span></span>
            <span class="md-set-pick__mark" aria-hidden="true">
              <span class="md-icon md-set-pick__off" data-icon="radio-off"></span>
              <span class="md-icon md-set-pick__on" data-icon="check"></span>
            </span>
          </label>
        </div>
        <div class="md-set-block">
          <span class="md-set-block__label">推荐强度</span>
          <div class="md-slider md-slider--fluid">
            <div class="md-slider__row">
              <input type="range" id="recStrength" min="0" max="100" step="1" value="60" data-suffix="%">
              <span class="md-slider__value">60%</span>
            </div>
          </div>
        </div>
        <button type="button" class="md-set-row" data-menu="langMenu">
          <span class="md-set-row__lead">
            <span class="md-icon" data-icon="settings" aria-hidden="true"></span>
            <span class="md-set-row__label">语言</span>
          </span>
          <span class="md-set-row__trail">
            <span class="md-set-row__hint" id="langHint">简体中文</span>
            <span class="md-icon" data-icon="chevron-right" aria-hidden="true"></span>
          </span>
        </button>
        <ul id="langMenu" class="md-menu md-menu--right md-menu--fixed">
          <li><button type="button" class="md-menu__item" data-lang="简体中文">简体中文</button></li>
          <li><button type="button" class="md-menu__item" data-lang="繁體中文">繁體中文</button></li>
          <li><button type="button" class="md-menu__item" data-lang="English">English</button></li>
        </ul>
      </div>
      </section>
      <section class="md-module">
      <div class="md-set-group">
        <div class="md-set-group__title">隐私</div>
        <div class="md-set-row">
          <span class="md-set-row__lead">
            <span class="md-icon" data-icon="view" aria-hidden="true"></span>
            <span class="md-set-row__label">允许推荐相似商品</span>
          </span>
          <span class="md-set-row__trail">
            <label class="md-switch"><input type="checkbox"><span class="md-switch__track"></span><span class="md-switch__thumb"></span></label>
          </span>
        </div>
      </div>
      </section>
    </main>
  </div>
  <script src="assets/md-icons.js"></script>
  <script src="assets/icons-extra.js"></script>
  <script src="assets/proto-page.js"></script>
  <script>
    document.querySelectorAll("#langMenu .md-menu__item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var hint = document.getElementById("langHint");
        var val = btn.getAttribute("data-lang") || btn.textContent.trim();
        if (hint) hint.textContent = val;
        ProtoPage.snackbar("已选择" + val);
      });
    });
  </script>
</body>
</html>
