<!-- LNY-PRD gold: 金样：左树右内容（不分页维护树）。总控（全部展开/收起、新增根节点）；节点增子/重命名/删除；拖到节点上=同级紧前、节点中=末个子节点、节点下=同级紧后。末级可否增子由 data-leaf-add / data-leaf 控制。只读树形列表见 desktop-lists 第四签；分类/大纲见 desktop-locator；表内嵌套见 desktop-tree-nest。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>PAGE-AD-005 树+内容</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-d1 md-d1--split">
    <div class="md-breadcrumb">
      <span>商品</span><span>/</span><span class="is-current">分类</span>
    </div>
    <div class="md-split">
      <aside class="md-split__side">
        <div class="md-tree-bar">
          <button type="button" class="md-btn md-btn--text md-btn--sm" data-tree-act="expand">全部展开</button>
          <button type="button" class="md-btn md-btn--text md-btn--sm" data-tree-act="collapse">全部收起</button>
          <button type="button" class="md-btn md-btn--contained md-btn--sm" data-tree-act="add-root">
            <span class="md-icon" data-icon="add" aria-hidden="true"></span>根节点
          </button>
        </div>
        <ul class="md-tree">
          <li class="is-open">
            <button type="button" class="md-tree__item is-active" data-cat="水果">
              <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
              <span class="md-tree__label">水果</span>
            </button>
            <ul>
              <li class="is-open">
                <button type="button" class="md-tree__item" data-cat="浆果">
                  <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                  <span class="md-tree__label">浆果</span>
                </button>
                <ul>
                  <li>
                    <button type="button" class="md-tree__item" data-cat="草莓">
                      <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                      <span class="md-tree__label">草莓</span>
                    </button>
                  </li>
                  <li>
                    <button type="button" class="md-tree__item" data-cat="蓝莓">
                      <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                      <span class="md-tree__label">蓝莓</span>
                    </button>
                  </li>
                </ul>
              </li>
              <li>
                <button type="button" class="md-tree__item" data-cat="柑橘">
                  <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                  <span class="md-tree__label">柑橘</span>
                </button>
              </li>
            </ul>
          </li>
          <li>
            <button type="button" class="md-tree__item" data-cat="饮品">
              <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
              <span class="md-tree__label">饮品</span>
            </button>
            <ul>
              <li>
                <button type="button" class="md-tree__item" data-cat="咖啡">
                  <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
                  <span class="md-tree__label">咖啡</span>
                </button>
              </li>
            </ul>
          </li>
          <li data-leaf>
            <button type="button" class="md-tree__item" data-cat="烘焙">
              <span class="md-icon md-tree__toggle" data-icon="chevron-right" aria-hidden="true"></span>
              <span class="md-tree__label">烘焙</span>
            </button>
          </li>
        </ul>
      </aside>
      <div class="md-split__main">
        <div class="md-section-head"><span class="md-section-head__title" id="catTitle">水果</span></div>
        <div class="md-paper">
          <table class="md-table">
            <thead>
              <tr>
                <th class="md-col-name">商品名称</th>
                <th class="md-col-price">售价</th>
                <th class="md-col-status">状态</th>
              </tr>
            </thead>
            <tbody id="catBody">
              <tr data-tree-item="水果,浆果,草莓"><td class="md-col-name">有机草莓 250g</td><td class="md-col-price">¥19.90</td><td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td></tr>
              <tr data-tree-item="水果,柑橘"><td class="md-col-name">赣南脐橙 5斤</td><td class="md-col-price">¥32.80</td><td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td></tr>
              <tr data-tree-item="饮品,咖啡"><td class="md-col-name">云南小粒咖啡 227g</td><td class="md-col-price">¥29.90</td><td class="md-col-status"><span class="md-chip">缺货</span></td></tr>
              <tr data-tree-item="饮品"><td class="md-col-name">青柠蜂蜜茶 500ml</td><td class="md-col-price">¥12.50</td><td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td></tr>
              <tr data-tree-item="烘焙"><td class="md-col-name">全麦吐司 400g</td><td class="md-col-price">¥9.90</td><td class="md-col-status"><span class="md-chip md-chip--success">有货</span></td></tr>
              <tr data-tree-item="水果,浆果,蓝莓"><td class="md-col-name">当季蓝莓 125g</td><td class="md-col-price">¥16.80</td><td class="md-col-status"><span class="md-chip md-chip--primary">新品</span></td></tr>
            </tbody>
          </table>
          <div class="md-skel-host is-hidden" data-skel-for="COMP-001">
            <div class="md-skeleton md-skeleton--row"></div>
            <div class="md-skeleton md-skeleton--row"></div>
          </div>
          <div class="md-empty md-empty--illus is-hidden" data-empty-for="COMP-001" data-empty-text="该分类暂无商品" data-error-text="加载失败">
            <div class="md-empty__art" aria-hidden="true"></div>
            <p class="md-empty__title">暂无内容</p>
            <p class="md-empty__text">该分类暂无商品</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
  <script>
    (function () {
      function paintCat(cat) {
        var n = 0;
        document.querySelectorAll("[data-tree-item]").forEach(function (row) {
          var tags = (row.getAttribute("data-tree-item") || "").split(",");
          var on = tags.indexOf(cat) !== -1;
          row.classList.toggle("is-hidden", !on);
          if (on) n += 1;
        });
        var empty = document.querySelector('[data-empty-for="COMP-001"]');
        if (empty) empty.classList.toggle("is-hidden", n > 0);
      }
      document.addEventListener("md-tree-select", function (ev) {
        paintCat(ev.detail.cat);
      });
      paintCat("水果");
    })();
  </script>
</body>
</html>
