<!-- LNY-PRD gold: 桌面时间轴（只读物流轴）。md-timeline--static：仅已发生节点、倒序、竖轨主色；通栏竖轨右横卡文本。可交互章节导航见 desktop-locator，禁止在本页演示可点切换进度。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<title>PAGE-AD-007 时间轴</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/mui-kit.css">
</head>
<body>
  <div class="md-d1">
    <div class="md-breadcrumb">
      <span>订单</span><span>/</span><span class="is-current">物流轨迹</span>

          <span class="md-timeline__node"></span>
          <span class="md-timeline__line"></span>
        </div>
        <article class="md-timeline__body md-card md-card--row">

            <div class="md-card__main">

            </div>
            <div class="md-card__photos">

              <div class="md-card__photo md-media-ph md-media-ph--3"></div>
            </div>
            <div class="md-card__foot">
              <div class="md-card__meta">
                <span class="md-card__meta-item"><span class="md-icon" data-icon="schedule" aria-hidden="true"></span>03-13 08:40</span>
                <span class="md-card__meta-item">杭州转运中心</span>
              </div>
            </div>
          </div>
        </article>
      </li>
      <li class="md-timeline__item is-path">
        <div class="md-timeline__rail" aria-hidden="true">
          <span class="md-timeline__node"></span>
          <span class="md-timeline__line"></span>
        </div>
        <article class="md-timeline__body md-card md-card--row">
          <div class="md-card__body">
            <div class="md-card__main">
              <h2 class="md-card__title">已揽收</h2>
              <p class="md-card__text">顺丰 SF1234567890 已揽收；冷链鲜果已入保温箱。</p>
            </div>
            <div class="md-card__foot">
              <div class="md-card__meta">
                <span class="md-card__meta-item"><span class="md-icon" data-icon="schedule" aria-hidden="true"></span>03-12 14:06</span>
              </div>
            </div>
          </div>
        </article>
      </li>
      <li class="md-timeline__item is-path">
        <div class="md-timeline__rail" aria-hidden="true">
          <span class="md-timeline__node"></span>
          <span class="md-timeline__line"></span>
        </div>
        <article class="md-timeline__body md-card md-card--row">
          <div class="md-card__body">
            <div class="md-card__main">
              <h2 class="md-card__title">已出库</h2>
              <p class="md-card__text">华东仓拣货完成，包裹等待揽收。</p>
            </div>
            <div class="md-card__foot">
              <div class="md-card__meta">
                <span class="md-card__meta-item"><span class="md-icon" data-icon="schedule" aria-hidden="true"></span>03-12 11:30</span>
              </div>
            </div>
          </div>
        </article>
      </li>
      <li class="md-timeline__item is-origin">
        <div class="md-timeline__rail" aria-hidden="true">
          <span class="md-timeline__node"></span>
        </div>
        <article class="md-timeline__body md-card md-card--row">
          <div class="md-card__body">
            <div class="md-card__main">
              <h2 class="md-card__title">已下单</h2>
              <p class="md-card__text">订单 OD-20260312-8821 已提交，等待仓库拣货打包。</p>
            </div>
            <div class="md-card__foot">
              <div class="md-card__meta">
                <span class="md-card__meta-item"><span class="md-icon" data-icon="schedule" aria-hidden="true"></span>03-12 09:20</span>
                <span class="md-card__meta-item">华东仓</span>

  <script src="./assets/md-icons.js"></script>
  <script src="./assets/icons-extra.js"></script>
  <script src="./assets/proto-page.js"></script>
</body>
</html>
